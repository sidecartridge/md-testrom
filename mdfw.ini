; EmuMD: this firmware's own C code built for the host and run in EmuMD's
; Hatari, with an emulated Multi-device on the cartridge port (emu/README.md).
;
;   tools/dev/build_hatari_fork.sh     # once: EmuMD's Hatari
;   tools/dev/mdfw.sh build            # build/md-testrom.mdfw
;   tools/dev/mdfw.sh run [--headless --frames N --screenshot out.png]

[firmware]
name = md-testrom
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
; Everything rp/src builds (rp/src/CMakeLists.txt) but the hardware layer
; EmuMD stands in for, which it leaves out by itself (romemul.c, commemul.c,
; select.c, hw_config.c, sdcard.c); emu/standins.c has the rest.
files =
    rp/src/*.c
    rp/src/settings/settings.c
    common/mdtest.c
    emu/*.c
exclude =
    ; The template's radio code: nothing calls it yet (the LED test drives
    ; the chip through cyw43_arch itself, which [wifi] below stands in for).
    rp/src/network.c
    rp/src/blink.c
    ; The microSD card's SPI driver: emu/standins.c stands in for the card,
    ; and FatFs works on the [run] sd folder.
    rp/src/cardhw.c
    ; The RP2040's watchdog, fault handlers and SCB: emu/standins.c
    rp/src/health.c

[compile]
shims =
    emu/shim
include =
    rp/src
    rp/src/include
    rp/src/settings
    common
defines =
    PICO_FLASH_ASSUME_CORE0_SAFE=1
    BOARD_TYPE_PICO_W=1
    BOARD_TYPE_PICO=0
    BOARD_TYPE_CUSTOM16MB=0
; Addresses are 64 bits on the host: a cast that cuts one must fail the build.
cflags = -O2 -include emu/shim/prefix.h -Werror=pointer-to-int-cast -Werror=int-to-pointer-cast

[wifi]
; EmuMD's radio chip, cyw43_arch and lwIP (the SDK's 2.2.1), as
; rp/src/CMakeLists.txt links pico_cyw43_arch_lwip_poll.
arch = poll

[run]
sd = emu/sd
; An ST with TOS 1.04 (UK, 50 Hz), linked locally as emu/tos/tos104uk.img
; (gitignored); --tos emu/tos/tos162uk.img --machine ste for the STE.
tos = emu/tos/tos104uk.img
machine = st
